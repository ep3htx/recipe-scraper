# Internal-only nginx sidecar for the Portainer/NPM deployment.
#
# NPM (jc21/nginx-proxy-manager) 2.15.1's "Custom Locations" and "Advanced"
# per-host config features silently fail to generate an nginx config file
# for a proxy host as soon as any extra server-block content is added
# (confirmed by testing on cerberus — the host's .conf file simply never
# gets written, with no error logged anywhere). Rather than fight that bug,
# this container does the path-splitting itself: plain HTTP, no TLS (NPM
# already terminates TLS in front of this), joined only to the shared
# `proxy` network. NPM's proxy host then just points here with a bare
# "Details tab" config — the one configuration shape that's actually
# proven reliable in that NPM version.

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://wellness-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://wellness-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
