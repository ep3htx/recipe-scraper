# Wellness Dashboard reverse proxy.
#
# server_name is intentionally "_" (catch-all) so this works out of the box
# on a bare LAN IP or any hostname. If you want to reject requests that don't
# match your domain, change it to your APP_DOMAIN value from .env.

upstream wellness_frontend {
    server frontend:3000;
}

upstream wellness_backend {
    server backend:4000;
}

# Plain HTTP: only used for the ACME challenge (certbot) and a health probe.
# Everything else is redirected to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---- API (backend) ----
    # Tighter rate limit on auth endpoints (login/register/refresh).
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://wellness_backend;
    }

    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://wellness_backend;
    }

    # ---- Frontend (static SPA, served by the frontend container) ----
    location /assets/ {
        proxy_pass http://wellness_frontend;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://wellness_frontend;
    }
}
