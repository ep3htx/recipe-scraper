# Wellness Dashboard — self-hosted stack
#   nginx (80/443, host-facing) -> frontend (static) + backend (API)
#                                            -> postgres (internal only)
#   ollama is optional (local AI) — enable with: docker compose --profile local-ai up -d
#
# All secrets come from .env (see .env.example). Nothing here is hard-coded.

services:
  postgres:
    image: postgres:16-alpine
    container_name: wellness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Intentionally NOT published to the host — only reachable from other
    # containers on the internal network. Never expose Postgres to the internet.
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wellness-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${BACKEND_PORT:-4000}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "${BACKEND_PORT:-4000}"
    networks:
      - internal
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT||4000) + '/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: wellness-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "${FRONTEND_PORT:-3000}"
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: wellness-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Optional local AI runtime. Not started by default.
  # Enable with: docker compose --profile local-ai up -d
  # Then set AI_PROVIDER=ollama and OLLAMA_BASE_URL=http://ollama:11434 in .env
  ollama:
    image: ollama/ollama:latest
    container_name: wellness-ollama
    restart: unless-stopped
    profiles: ["local-ai"]
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
  nginx_cache:
  ollama_data:
