{% extends "base.html" %}
{% block title %}Import from URL — Recipe Box{% endblock %}
{% block content %}
    <h1>Import from URL</h1>
    <p class="hint">Paste a link to a recipe page. Works on most sites that embed standard recipe markup (schema.org).</p>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <form method="post" action="{{ url_for('scrape_recipe') }}" class="recipe-form">
        <label>Recipe URL
            <input type="text" name="url" value="{{ url }}" placeholder="https://example.com/some-recipe" required autofocus>
        </label>
        <div class="actions">
            <button type="submit" class="button">Fetch Recipe</button>
            <a class="button button-secondary" href="{{ url_for('index') }}">Cancel</a>
        </div>
    </form>
{% endblock %}
